apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  description: Clone, lint, test, build, push and deploy the Accounts service.
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
      type: string
      description: Public Git repository to build.
    - name: branch
      type: string
      default: main
    - name: build-image
      type: string
      description: Complete registry/repository:tag for the resulting image.
    - name: registry-tls-verify
      type: string
      default: "true"
      description: Keep true except for an isolated local development registry.
  tasks:
    - name: init
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: clone
      runAfter: [init]
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
      workspaces:
        - name: output
          workspace: pipeline-workspace
    - name: lint
      runAfter: [clone]
      taskRef:
        name: flake8
      params:
        - name: image
          value: python:3.9-slim
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: tests
      runAfter: [clone]
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: build
      runAfter: [lint, tests]
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: $(params.build-image)
        - name: STORAGE_DRIVER
          value: vfs
        - name: TLSVERIFY
          value: $(params.registry-tls-verify)
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: deploy
      runAfter: [build]
      taskRef:
        name: deploy-accounts
      params:
        - name: image
          value: $(params.build-image)
      workspaces:
        - name: source
          workspace: pipeline-workspace
