apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3.20
      env:
        - name: SOURCE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        case "$SOURCE_PATH" in /workspace/*) ;; *) echo 'Refusing unsafe workspace path'; exit 1 ;; esac
        find "$SOURCE_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Run all tests with nosetests against an isolated SQLite database.
  workspaces:
    - name: source
  steps:
    - name: test
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: sqlite:////tmp/accounts-test.db
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        python -m venv /tmp/test-venv
        . /tmp/test-venv/bin/activate
        python -m pip install --no-cache-dir -r requirements.txt
        nosetests --with-spec --spec-color --with-coverage --cover-package=service --cover-erase --cover-min-percentage=95
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy-accounts
spec:
  description: Apply the deployment and service, then verify rollout completion.
  params:
    - name: image
      type: string
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:4.14
      workingDir: $(workspaces.source.path)
      env:
        - name: BUILD_IMAGE
          value: $(params.image)
      script: |
        #!/bin/sh
        set -eu
        oc set image --local -f deploy/deployment.yaml accounts="$BUILD_IMAGE" -o yaml | oc apply -f -
        oc apply -f deploy/service.yaml
        oc rollout status deployment/accounts --timeout=180s
        oc get deployments,pods,replicasets,services -l app=accounts

